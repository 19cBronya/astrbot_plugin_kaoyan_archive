<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>考研答疑归档</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ASTRBOT · PRIVATE ARCHIVE</p>
          <h1>考研答疑归档</h1>
          <p class="subtitle">只观察白名单私聊，在“问完”边界把对话区间整理成可查询的题目。</p>
        </div>
        <div class="hero-actions">
          <span id="connection" class="badge muted">正在连接</span>
          <button id="refresh" class="button secondary" type="button">刷新数据</button>
        </div>
      </header>

      <section id="stats" class="stats" aria-label="归档总览"></section>

      <div class="layout">
        <aside class="sidebar">
          <section class="panel config-panel">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">PROCESSING SCOPE</p>
                <h2>UMO 白名单</h2>
              </div>
              <span id="whitelist-count" class="counter">0</span>
            </div>
            <p class="help">一行一个完整私聊 UMO。列表为空时，插件不会处理任何消息。</p>
            <textarea
              id="whitelist"
              rows="8"
              spellcheck="false"
              placeholder="default:FriendMessage:123456"
            ></textarea>
            <div class="config-actions">
              <button id="save-config" class="button primary" type="button">保存白名单</button>
              <span id="save-state" class="inline-state"></span>
            </div>
            <div class="divider"></div>
            <dl class="config-summary">
              <div><dt>结束短语</dt><dd id="end-phrases">—</dd></div>
              <div><dt>归档科目</dt><dd id="subjects">—</dd></div>
            </dl>
          </section>
        </aside>

        <section class="content">
          <section class="panel">
            <div class="panel-heading list-heading">
              <div>
                <p class="section-kicker">ARCHIVED QUESTIONS</p>
                <h2>题目档案</h2>
              </div>
              <span id="result-count" class="muted-text"></span>
            </div>

            <form id="filters" class="filters">
              <label>
                <span>关键词</span>
                <input id="search" type="search" placeholder="题号、标题或摘要" />
              </label>
              <label>
                <span>UMO</span>
                <input id="filter-umo" type="text" placeholder="全部 UMO" />
              </label>
              <label>
                <span>科目</span>
                <select id="filter-subject"><option value="">全部科目</option></select>
              </label>
              <label class="check-label">
                <input id="include-deleted" type="checkbox" />
                <span>显示已删除</span>
              </label>
              <button class="button secondary" type="submit">查询</button>
            </form>

            <div id="question-list" class="question-list" aria-live="polite"></div>
            <div id="empty-list" class="empty hidden">
              <div class="empty-icon">∅</div>
              <p>还没有符合条件的归档题目。</p>
            </div>
          </section>
        </section>
      </div>
    </main>

    <div id="detail-overlay" class="overlay hidden" role="dialog" aria-modal="true">
      <article class="detail-drawer">
        <header class="detail-header">
          <div>
            <p id="detail-id" class="section-kicker"></p>
            <h2 id="detail-title">题目详情</h2>
          </div>
          <button id="close-detail" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div id="detail-meta" class="detail-meta"></div>
        <section class="detail-section">
          <h3>归档摘要</h3>
          <pre id="detail-summary" class="summary"></pre>
        </section>
        <section class="detail-section">
          <div class="timeline-heading">
            <h3>完整题目时间线</h3>
            <span id="detail-event-count" class="counter"></span>
          </div>
          <div id="detail-timeline" class="timeline"></div>
        </section>
        <footer id="detail-actions" class="detail-actions"></footer>
      </article>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
