<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>考研答疑归档</title>
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">ASTRBOT · PRIVATE ARCHIVE</p>
          <h1>考研答疑归档</h1>
          <p class="subtitle">只观察白名单私聊，在“问完”边界把对话区间整理成可查询的题目。</p>
        </div>
        <div class="hero-actions">
          <span id="connection" class="badge muted">正在连接</span>
          <button id="refresh" class="button secondary" type="button">刷新数据</button>
        </div>
      </header>

      <section id="stats" class="stats" aria-label="归档总览"></section>

      <section class="panel archive-panel">
        <div class="panel-heading list-heading">
          <div>
            <p class="section-kicker">QUESTION LIBRARY</p>
            <h2>全部题目</h2>
            <p class="section-description">选择筛选条件缩小范围，点击题目查看知识点、总结和原始会话。</p>
          </div>
          <span id="result-count" class="result-count"></span>
        </div>

        <form id="filters" class="filters">
          <label class="search-field">
            <span>搜索</span>
            <input id="search" type="search" placeholder="题号、标题、概览、知识点或总结" />
          </label>
          <label>
            <span>科目</span>
            <select id="filter-subject"><option value="">全部科目</option></select>
          </label>
          <label>
            <span>状态</span>
            <select id="filter-status">
              <option value="">全部状态</option>
              <option value="ARCHIVED">已归档</option>
              <option value="FINALIZING">整理中</option>
              <option value="FINALIZE_FAILED">整理失败</option>
            </select>
          </label>
          <label>
            <span>会话</span>
            <select id="filter-umo"><option value="">全部会话</option></select>
          </label>
          <label class="check-label">
            <input id="include-deleted" type="checkbox" />
            <span>含已删除</span>
          </label>
          <button class="button secondary" type="submit">筛选</button>
        </form>

        <div id="question-list" class="question-list" aria-live="polite"></div>
        <div id="empty-list" class="empty hidden">
          <div class="empty-icon">∅</div>
          <p>还没有符合条件的题目。</p>
        </div>
      </section>
    </main>

    <div id="detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <article class="detail-drawer">
        <header class="detail-header">
          <div>
            <p id="detail-id" class="section-kicker"></p>
            <h2 id="detail-title">题目详情</h2>
          </div>
          <button id="close-detail" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div id="detail-meta" class="detail-meta"></div>
        <form id="edit-form" class="edit-form hidden">
          <div class="edit-grid">
            <label>
              <span>题目标题</span>
              <input id="edit-title" type="text" maxlength="200" required />
            </label>
            <label>
              <span>归档科目</span>
              <select id="edit-subject" required></select>
            </label>
            <label>
              <span>题目概览</span>
              <textarea id="edit-overview" rows="3" maxlength="300" placeholder="1–2 句话概括问题和核心解题方向"></textarea>
            </label>
            <label>
              <span>知识点</span>
              <textarea id="edit-knowledge" rows="5" placeholder="一行一个知识点，最多 20 个"></textarea>
            </label>
            <label>
              <span>Markdown 总结</span>
              <textarea id="edit-summary" class="summary-editor" rows="16" maxlength="200000" required></textarea>
            </label>
          </div>
          <p class="edit-note">这里只修改归档展示内容；题号和原始会话始终保持不变。保存前的版本会进入修订记录。</p>
        </form>
        <div id="detail-view">
          <section class="detail-section">
            <p class="section-kicker">KNOWLEDGE POINTS</p>
            <h3>知识点</h3>
            <div id="detail-knowledge" class="knowledge-list"></div>
          </section>
          <section class="detail-section">
            <p class="section-kicker">ARCHIVE SUMMARY</p>
            <h3>题目总结</h3>
            <div id="detail-summary" class="summary"></div>
          </section>
          <section class="detail-section">
            <div class="timeline-heading">
              <div>
                <p class="section-kicker">RAW CONVERSATION</p>
                <h3>原始会话</h3>
              </div>
              <span id="detail-event-count" class="counter"></span>
            </div>
            <div id="detail-timeline" class="timeline"></div>
          </section>
        </div>
        <footer id="detail-actions" class="detail-actions"></footer>
      </article>
    </div>

    <div id="confirm-overlay" class="overlay confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <section class="confirm-dialog panel">
        <p class="section-kicker">CONFIRM ACTION</p>
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="button secondary" type="button">取消</button>
          <button id="confirm-submit" class="button primary" type="button">确认</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="./vendor/katex/katex.min.js"></script>
    <script src="./vendor/katex/contrib/auto-render.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
